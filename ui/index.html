<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibeKeys</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171918;
      --muted: #717672;
      --line: #dfe3df;
      --paper: #fff;
      --soft: #f4f6f4;
      --accent: #17745b;
      --accent-soft: #e6f2ed;
      --warning: #a75822;
      --shadow: 0 16px 44px rgba(28, 34, 30, .08);
    }
    * { box-sizing: border-box; }
    html, body { overflow: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #f1f3f1;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    .shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); height: 100vh; }
    aside {
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      border-right: 1px solid var(--line);
      background: var(--paper);
    }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 32px; }
    .mark {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
    }
    .mark img { display: block; width: 36px; height: 36px; image-rendering: pixelated; }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .subtitle, .hint { color: var(--muted); font-size: 12px; }
    .subtitle { margin-top: 2px; }
    nav { display: grid; gap: 5px; }
    .nav-item {
      padding: 10px 11px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }
    .nav-item.active { background: var(--soft); color: var(--ink); font-weight: 650; }
    .language-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      margin-top: 18px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--soft);
    }
    .language-switch button {
      min-height: 30px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .language-switch button.active { background: var(--paper); color: var(--ink); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .side-status {
      margin-top: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--soft);
      font-size: 12px;
      line-height: 1.5;
    }
    .online { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    main { min-width: 0; overflow-y: auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h2 { margin: 0; font-size: 25px; letter-spacing: 0; }
    .lead { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .save-state { align-self: center; color: var(--muted); font-size: 13px; }
    .view { display: none; }
    .view.active { display: block; }
    .view[data-view-panel="bindings"] { max-width: 880px; }
    .view[data-view-panel="scope"] { max-width: 720px; }
    .view[data-view-panel="devices"] .device-list {
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      max-height: none;
    }
    .panel { min-width: 0; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: var(--shadow); }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 17px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h3 { margin: 0; font-size: 14px; letter-spacing: 0; }
    .panel-body { padding: 17px; }
    .btn {
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
    }
    .btn:hover { background: var(--soft); }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .btn.primary:hover { background: #115f49; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .toggle {
      position: relative;
      width: 44px;
      height: 25px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #cfd4d0;
    }
    .toggle::after {
      content: "";
      display: block;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      transition: transform .15s ease;
    }
    .toggle.on { border-color: var(--accent); background: var(--accent); }
    .toggle.on::after { transform: translateX(19px); }
    .mapping-area { display: grid; grid-template-columns: 185px minmax(0, 1fr); gap: 22px; align-items: center; }
    .mouse {
      position: relative;
      width: 158px;
      height: 226px;
      margin: 8px auto;
      border: 2px solid #383b39;
      border-radius: 61px 61px 72px 72px;
      background: #e9ece9;
      box-shadow: inset 0 -14px 22px rgba(0,0,0,.07), 0 12px 25px rgba(0,0,0,.08);
    }
    .mouse::before { content: ""; position: absolute; top: 18px; left: 50%; width: 2px; height: 75px; background: #383b39; }
    .mouse-part { position: absolute; border: 1px solid #303330; background: #d1d6d2; }
    .wheel { top: 38px; left: 69px; width: 17px; height: 40px; border-radius: 10px; background: #252725; }
    .side { left: -17px; width: 42px; height: 23px; border-radius: 7px; }
    .x1 { top: 87px; }
    .x2 { top: 118px; }
    .mouse-part.active { outline: 3px solid rgba(23,116,91,.28); outline-offset: 3px; }
    .bindings { display: grid; gap: 9px; }
    .binding {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) minmax(125px, 155px);
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
    }
    .binding strong { display: block; margin-bottom: 3px; font-size: 13px; }
    select { width: 100%; min-height: 35px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: white; }
    .device-list { display: grid; gap: 9px; min-height: 84px; max-height: 245px; overflow-y: auto; }
    .device-card { min-width: 0; overflow: hidden; padding: 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--soft); }
    .device-card strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .device-name { overflow: hidden; color: var(--muted); font-family: Consolas, monospace; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .context { display: grid; grid-template-columns: 88px 1fr; gap: 8px; font-size: 12px; }
    .context dt { color: var(--muted); }
    .context dd { min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scope-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .scope-option {
      min-height: 76px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }
    .scope-option strong { display: block; margin-bottom: 5px; font-size: 13px; }
    .scope-option.active { border-color: var(--accent); background: var(--accent-soft); }
    .allowlist { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
    .allowlist-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .allowlist-head strong { font-size: 13px; }
    .allowlist-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .allowlist-form input {
      min-width: 0;
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
    }
    .allowlist-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .process-list { display: grid; gap: 7px; margin-top: 10px; }
    .process-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      align-items: center;
      min-height: 39px;
      padding-left: 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
    }
    .process-name { overflow: hidden; font-family: Consolas, monospace; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .remove-process { width: 34px; height: 34px; border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; }
    .remove-process:hover { color: #a02c2c; }
    .empty-list { padding: 12px; border: 1px dashed var(--line); border-radius: 6px; text-align: center; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 10px 13px;
      border-radius: 7px;
      background: var(--ink);
      color: white;
      font-size: 13px;
      opacity: 0;
      transform: translateY(6px);
      transition: .16s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }
    @media (max-width: 900px) {
      .shell, .mapping-area { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .side-status { margin-top: 22px; }
      main { padding: 18px; }
    }
    @media (max-width: 560px) {
      .topbar { flex-direction: column; }
      .binding { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><div class="mark"><img alt="VK" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAADqSURBVFhH7Y7LDcIwEETTBdAHdVISrYGMZrSTeOwkwiv5kCe9w37s2eVij9vj/vlHfHMO99EI8X0f93CkiPG4BxkirsYtZ4i4GrecIeLWuMVMERvokGhPJayf79dP3VHdHLGBDon2VMJ62gNa/SJiAx0S7amE9XQH9IIpYgMdEu2phPU0BxwJpogNdEi0pxLWww+gpFXTbfCRQxAbuCXSqul0B+z1i4gN3BJp1TTtAErcrNgLKro5YgMdbiVuVkw/IEPErnGLGSKuxi1niLgat5wh4jzuwUgR08c9HCG+P4f76Iz45qLBsnwBHJxzKUFlyfMAAAAASUVORK5CYII="></div><div><h1>VibeKeys</h1><div class="subtitle" data-i18n="subtitle">鼠标键位控制台</div></div></div>
      <nav>
        <button class="nav-item active" data-view="bindings" data-i18n="navBindings">键位映射</button>
        <button class="nav-item" data-view="devices" data-i18n="navDevices">鼠标设备</button>
        <button class="nav-item" data-view="scope" data-i18n="navScope">生效范围</button>
      </nav>
      <div class="language-switch" aria-label="Language / 语言">
        <button data-language="zh">中</button>
        <button data-language="en">EN</button>
      </div>
      <div class="side-status"><div class="online"><span class="dot"></span><span data-i18n="serviceRunning">服务运行中</span></div><div id="sideMessage" data-i18n="autoSave">配置修改会自动保存并立即生效。</div></div>
    </aside>
    <main>
      <div class="topbar">
        <div><h2 id="viewTitle">键位映射</h2><p class="lead" id="viewLead">为侧键与中键分配终端操作。</p></div>
        <div class="save-state" id="saveState">正在连接...</div>
      </div>
      <div class="view active" data-view-panel="bindings">
        <section class="panel">
          <div class="panel-head"><h3 data-i18n="mouseButtons">鼠标按键</h3><button class="btn" id="resetBtn" data-i18n="reset">恢复默认</button></div>
          <div class="panel-body">
            <div class="toggle-row"><div><strong data-i18n="enableMappings">启用映射</strong><div class="hint" data-i18n="enableHint">启用或暂停当前鼠标映射</div></div><button class="toggle" id="enabledToggle" aria-label="启用映射"></button></div>
            <div class="mapping-area">
              <div class="mouse">
                <button class="mouse-part side x1" data-button="x1" title="侧键 4"></button>
                <button class="mouse-part side x2" data-button="x2" title="侧键 5"></button>
                <button class="mouse-part wheel" data-button="middle" title="中键"></button>
              </div>
              <div class="bindings" id="bindingList"></div>
            </div>
          </div>
        </section>
      </div>
      <div class="view" data-view-panel="devices">
        <section class="panel">
          <div class="panel-head"><h3 data-i18n="connectedMice">已连接的鼠标</h3><span class="hint" data-i18n="detectedAtStartup">启动时自动检测</span></div>
          <div class="panel-body"><div class="device-list" id="deviceList"><span class="hint" data-i18n="detecting">正在检测...</span></div></div>
        </section>
      </div>
      <div class="view" data-view-panel="scope">
        <section class="panel">
          <div class="panel-head"><h3 data-i18n="chooseScope">选择生效范围</h3><span class="hint" data-i18n="protectApps">默认保护普通软件</span></div>
          <div class="panel-body">
            <div class="scope-options">
              <button class="scope-option" data-scope="cli"><strong data-i18n="scopeCli">仅 CLI</strong><span class="hint" data-i18n="scopeCliHint">只在终端和交互式命令行中生效</span></button>
              <button class="scope-option" data-scope="all"><strong data-i18n="scopeAll">所有窗口</strong><span class="hint" data-i18n="scopeAllHint">浏览器和其他软件也会接管鼠标键</span></button>
            </div>
            <div class="allowlist">
              <div class="allowlist-head"><strong data-i18n="terminalAllowlist">终端白名单</strong><span class="hint" data-i18n="allowlistHint">仅 CLI 模式使用进程名匹配</span></div>
              <div class="allowlist-form">
                <input id="processInput" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="processPlaceholder" placeholder="例如 wezterm-gui.exe">
                <button class="btn primary" id="addProcessBtn" data-i18n="addProcess">添加</button>
              </div>
              <div class="process-list" id="processList"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const bootstrap = __VIBEKEYS_BOOTSTRAP__;
    const translations = {
      zh: {
        subtitle: "鼠标键位控制台", navBindings: "键位映射", navDevices: "鼠标设备", navScope: "生效范围",
        serviceRunning: "服务运行中", autoSave: "配置修改会自动保存并立即生效。",
        mouseButtons: "鼠标按键", reset: "恢复默认", enableMappings: "启用映射", enableHint: "启用或暂停当前鼠标映射",
        connectedMice: "已连接的鼠标", detectedAtStartup: "启动时自动检测", detecting: "正在检测...", noDevices: "没有检测到鼠标设备。",
        chooseScope: "选择生效范围", protectApps: "默认保护普通软件", scopeCli: "仅 CLI", scopeCliHint: "只在终端和交互式命令行中生效",
        scopeAll: "所有窗口", scopeAllHint: "浏览器和其他软件也会接管鼠标键",
        terminalAllowlist: "终端白名单", allowlistHint: "仅 CLI 模式使用进程名匹配", processPlaceholder: "例如 wezterm-gui.exe", addProcess: "添加",
        emptyAllowlist: "白名单为空，CLI 模式下不会接管任何窗口", invalidProcess: "请输入有效的进程名", duplicateProcess: "该进程已在白名单中", processAdded: "已加入终端白名单", processRemoved: "已从终端白名单移除", removeProcess: "移除",
        saving: "正在保存...", saved: "已保存，映射已生效", saveFailed: "保存失败", running: "映射运行中",
        scopeCliToast: "现在只在 CLI 中生效", scopeAllToast: "现在对所有窗口生效", resetToast: "已恢复默认映射",
        detected: (button, action) => `检测到 ${button}，当前映射为 ${action}。`,
        views: {
          bindings: ["键位映射", "为侧键与中键分配终端操作。"],
          devices: ["鼠标设备", "查看系统识别到的鼠标品牌与硬件信息。"],
          scope: ["生效范围", "决定鼠标映射只服务于 CLI，还是覆盖所有软件。"]
        },
        actions: { up: "上移", down: "下移", enter: "确认", left: "左移", right: "右移", tab: "Tab", escape: "Esc", pageup: "上一页", pagedown: "下一页", home: "Home", end: "End", space: "空格" },
        buttons: { x1: ["侧键 4 / X1", "通常为后退键"], x2: ["侧键 5 / X2", "通常为前进键"], middle: ["滚轮中键", "按下滚轮"] }
      },
      en: {
        subtitle: "Mouse mapping console", navBindings: "Bindings", navDevices: "Mouse devices", navScope: "Activation scope",
        serviceRunning: "Service running", autoSave: "Changes are saved automatically and applied instantly.",
        mouseButtons: "Mouse buttons", reset: "Reset defaults", enableMappings: "Enable mappings", enableHint: "Enable or pause the current mouse mappings",
        connectedMice: "Connected mice", detectedAtStartup: "Detected at startup", detecting: "Detecting...", noDevices: "No mouse devices detected.",
        chooseScope: "Choose activation scope", protectApps: "Regular apps are protected by default", scopeCli: "CLI only", scopeCliHint: "Active only in terminals and interactive command-line apps",
        scopeAll: "All windows", scopeAllHint: "Mouse buttons are also remapped in browsers and other apps",
        terminalAllowlist: "Terminal allowlist", allowlistHint: "CLI-only mode matches process names", processPlaceholder: "For example, wezterm-gui.exe", addProcess: "Add",
        emptyAllowlist: "The allowlist is empty. CLI-only mode will not capture any window.", invalidProcess: "Enter a valid process name", duplicateProcess: "This process is already allowlisted", processAdded: "Added to terminal allowlist", processRemoved: "Removed from terminal allowlist", removeProcess: "Remove",
        saving: "Saving...", saved: "Saved and applied", saveFailed: "Save failed", running: "Mappings active",
        scopeCliToast: "Mappings now apply to CLI windows only", scopeAllToast: "Mappings now apply to all windows", resetToast: "Default mappings restored",
        detected: (button, action) => `Detected ${button}. Current action: ${action}.`,
        views: {
          bindings: ["Bindings", "Assign terminal actions to side and middle mouse buttons."],
          devices: ["Mouse devices", "View detected mouse brands and hardware information."],
          scope: ["Activation scope", "Choose whether mappings apply only to CLI apps or every window."]
        },
        actions: { up: "Up", down: "Down", enter: "Enter", left: "Left", right: "Right", tab: "Tab", escape: "Escape", pageup: "Page Up", pagedown: "Page Down", home: "Home", end: "End", space: "Space" },
        buttons: { x1: ["Side button 4 / X1", "Usually the Back button"], x2: ["Side button 5 / X2", "Usually the Forward button"], middle: ["Middle button", "Press the scroll wheel"] }
      }
    };
    const defaultConfig = {
      enabled: true,
      scope: "cli",
      language: "zh",
      terminal_processes: ["WindowsTerminal.exe", "pwsh.exe", "powershell.exe", "cmd.exe"],
      bindings: { middle: "enter", x1: "up", x2: "down" }
    };
    let state = bootstrap.config || structuredClone(defaultConfig);
    state.scope ||= "cli";
    state.language ||= "zh";
    state.terminal_processes = Array.isArray(state.terminal_processes) ? state.terminal_processes : structuredClone(defaultConfig.terminal_processes);
    let currentView = "bindings";
    const detectedDevices = bootstrap.devices || [];
    let saveTimer;
    const bindingList = document.querySelector("#bindingList");
    const toggle = document.querySelector("#enabledToggle");
    const saveState = document.querySelector("#saveState");
    const toast = document.querySelector("#toast");

    function copy() {
      return translations[state.language] || translations.zh;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1500);
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[character]);
    }
    function render() {
      const text = copy();
      document.documentElement.lang = state.language === "en" ? "en" : "zh-CN";
      document.querySelectorAll("[data-i18n]").forEach(element => {
        element.textContent = text[element.dataset.i18n];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {
        element.placeholder = text[element.dataset.i18nPlaceholder];
      });
      document.querySelectorAll("[data-language]").forEach(option => option.classList.toggle("active", option.dataset.language === state.language));
      document.querySelector("#viewTitle").textContent = text.views[currentView][0];
      document.querySelector("#viewLead").textContent = text.views[currentView][1];
      toggle.setAttribute("aria-label", text.enableMappings);
      toggle.classList.toggle("on", state.enabled);
      document.querySelectorAll("[data-scope]").forEach(option => option.classList.toggle("active", option.dataset.scope === state.scope));
      bindingList.innerHTML = Object.entries(text.buttons).map(([key, value]) => {
        const options = Object.entries(text.actions).map(([id, label]) => `<option value="${id}" ${state.bindings[key] === id ? "selected" : ""}>${label}</option>`).join("");
        return `<div class="binding"><div><strong>${value[0]}</strong><span class="hint">${value[1]}</span></div><select data-map="${key}">${options}</select></div>`;
      }).join("");
      renderProcessList();
      loadDevices();
    }
    function renderProcessList() {
      const root = document.querySelector("#processList");
      const text = copy();
      root.innerHTML = state.terminal_processes.length
        ? state.terminal_processes.map((name, index) => `<div class="process-item"><span class="process-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span><button class="remove-process" data-remove-process="${index}" title="${escapeHtml(text.removeProcess)}" aria-label="${escapeHtml(text.removeProcess)}">&times;</button></div>`).join("")
        : `<div class="empty-list hint">${text.emptyAllowlist}</div>`;
    }
    function addProcess() {
      const input = document.querySelector("#processInput");
      let name = input.value.trim().replace(/^["']|["']$/g, "");
      if (!name || /[\\/:*?"<>|]/.test(name)) {
        showToast(copy().invalidProcess);
        return;
      }
      if (!name.toLowerCase().endsWith(".exe")) name += ".exe";
      if (state.terminal_processes.some(item => item.toLowerCase() === name.toLowerCase())) {
        showToast(copy().duplicateProcess);
        return;
      }
      state.terminal_processes.push(name);
      input.value = "";
      renderProcessList();
      queueSave();
      showToast(copy().processAdded);
    }
    function queueSave() {
      saveState.textContent = copy().saving;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveConfig, 180);
    }
    function saveConfig() {
      try {
        window.ipc.postMessage(JSON.stringify({ type: "saveConfig", config: state }));
        saveState.textContent = copy().saved;
      } catch (error) {
        saveState.textContent = copy().saveFailed;
        showToast(error.message);
      }
    }
    function loadDevices() {
      const root = document.querySelector("#deviceList");
      root.innerHTML = detectedDevices.length ? detectedDevices.map(device => `<div class="device-card"><strong>${escapeHtml(device.brand)}</strong><div class="hint">VID ${escapeHtml(device.vendor_id || "-")} · PID ${escapeHtml(device.product_id || "-")}</div><div class="device-name" title="${escapeHtml(device.name)}">${escapeHtml(device.name)}</div></div>`).join("") : `<span class="hint">${copy().noDevices}</span>`;
    }
    document.addEventListener("change", event => {
      const key = event.target.dataset.map;
      if (!key) return;
      state.bindings[key] = event.target.value;
      queueSave();
    });
    document.addEventListener("mousedown", event => {
      const key = ({ 1: "middle", 3: "x1", 4: "x2" })[event.button];
      if (!key) return;
      const part = document.querySelector(`[data-button="${key}"]`);
      part?.classList.add("active");
      setTimeout(() => part?.classList.remove("active"), 500);
      const text = copy();
      document.querySelector("#sideMessage").textContent = text.detected(text.buttons[key][0], text.actions[state.bindings[key]]);
    });
    toggle.addEventListener("click", () => { state.enabled = !state.enabled; render(); queueSave(); });
    document.querySelectorAll("[data-language]").forEach(option => option.addEventListener("click", () => {
      if (state.language === option.dataset.language) return;
      state.language = option.dataset.language;
      render();
      document.querySelector("#sideMessage").textContent = copy().autoSave;
      queueSave();
    }));
    document.querySelectorAll("[data-scope]").forEach(option => option.addEventListener("click", () => {
      state.scope = option.dataset.scope;
      render();
      queueSave();
      showToast(state.scope === "cli" ? copy().scopeCliToast : copy().scopeAllToast);
    }));
    document.querySelector("#addProcessBtn").addEventListener("click", addProcess);
    document.querySelector("#processInput").addEventListener("keydown", event => {
      if (event.key === "Enter") addProcess();
    });
    document.querySelector("#processList").addEventListener("click", event => {
      const button = event.target.closest("[data-remove-process]");
      if (!button) return;
      state.terminal_processes.splice(Number(button.dataset.removeProcess), 1);
      renderProcessList();
      queueSave();
      showToast(copy().processRemoved);
    });
    document.querySelector("#resetBtn").addEventListener("click", () => {
      const language = state.language;
      state = structuredClone(defaultConfig);
      state.language = language;
      render();
      queueSave();
      showToast(copy().resetToast);
    });
    document.querySelectorAll("[data-view]").forEach(item => item.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach(nav => nav.classList.remove("active"));
      item.classList.add("active");
      currentView = item.dataset.view;
      document.querySelectorAll("[data-view-panel]").forEach(panel => panel.classList.toggle("active", panel.dataset.viewPanel === item.dataset.view));
      document.querySelector("#viewTitle").textContent = copy().views[currentView][0];
      document.querySelector("#viewLead").textContent = copy().views[currentView][1];
      document.querySelector("main").scrollTop = 0;
    }));
    render();
    saveState.textContent = copy().running;
  </script>
</body>
</html>
